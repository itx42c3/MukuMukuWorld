<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MukuMukuWorld" />
  <meta name="theme-color" content="#101017" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>MukuMukuWorld</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <span class="app-title">MUKUMUKUWORLD</span>
      <div id="file-menu"></div>
      <div class="history-controls">
        <button class="history-btn" id="btn-undo" title="元に戻す (Cmd+Z)">↶</button>
        <button class="history-btn" id="btn-redo" title="やり直し (Shift+Cmd+Z)">↷</button>
      </div>
    </header>
    <nav id="palette"></nav>
    <main class="canvas-area">
      <canvas id="chart-canvas"></canvas>
    </main>
    <aside id="property-panel"></aside>
    <div id="transport"></div>
  </div>
  <div class="orientation-warning">
    このアプリは横向き専用です。iPadを横向きにしてください。
  </div>
</body>
</html>
